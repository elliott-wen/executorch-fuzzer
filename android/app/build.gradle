plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.fuzzer.etclient'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fuzzer.etclient'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
        // arm64 is the real phone target; x86_64 lets it run in an emulator.
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildTypes {
        release { minifyEnabled false }
    }
    // QNN/HTP requires the Hexagon skel (libQnnHtpV*Skel.so) to exist as a REAL FILE in a path
    // the DSP's fastRPC loader can read — the APK native lib dir (/data/app/.../lib/arm64,
    // SELinux apk_data_file). useLegacyPackaging=true makes the installer EXTRACT the .so there;
    // with =false they are only mmap'd from the .apk (no on-disk file) and the skel fails to load
    // ("Failed to create transport for device / load skel, error: 4000"). Extracting to the app's
    // private files dir does NOT work — fastRPC can't read app_data_file. See ExecutorService.kt.
    // Trade-off: this drops the 16 KB-aligned APK packaging (fine for 4 KB-page test devices like
    // the ROG Phone 6 / SM8475; revisit for 16 KB-page hardware — see README_16KB.md).
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // ExecuTorch Android runtime — LOCALLY BUILT from source (extension/android) with the
    // jni_layer.cpp fix: Module.execute throws a catchable ExecutorchRuntimeException instead of
    // fbjni-aborting on an untranslatable C++ exception. A flatDir AAR has no POM, so its
    // transitive deps (fbjni, soloader nativeloader, core-ktx) are declared explicitly below.
    implementation(name: 'executorch', ext: 'aar')
    implementation 'com.facebook.fbjni:fbjni:0.7.0'
    implementation 'com.facebook.soloader:nativeloader:0.10.5'
    implementation 'androidx.core:core-ktx:1.13.1'
    // Pure-Java ZeroMQ — speaks the broker's REQ/SUB wire format, no native zmq build.
    implementation 'org.zeromq:jeromq:0.6.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
